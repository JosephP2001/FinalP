version: '3.8'

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: survey_frontend
    ports:
      - "3000:80" #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    depends_on:
      - backend
    networks:
      - survey_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: survey_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    networks:
      - survey_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
 #------------------------------------
  mongo:
    image: mongo:7.0
    container_name: survey_mongodb
    ports:
      - "27017:27017"
    volumes:   #////////////////////
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=survey_db
    networks:
      - survey_network
    restart: unless-stopped
#-------------------------------------
  redis:
    image: redis:7-alpine
    container_name: survey_redis
    ports:
      - "6379:6379"
    volumes:    #()()()()()()()()()()()()()()()
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - survey_network
    restart: unless-stopped
 #-------------------------------------   
networks:
  survey_network:
    driver: bridge

volumes:  #()()()()()()()()()()()()()()()
  mongodb_data:
    driver: local
  redis_data:
    driver: local